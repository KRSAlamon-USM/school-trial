<body>
<div class="parent">
 
    <header class="top">
        <div class="header-left">
            <span class="app-brand-name">Messages</span>

        <div class="header-right">
            <div class="profile-avatar" aria-label="Your profile">K</div>

    <nav class="navigation">

            <a href="#" id="menuToggle" aria-label="Toggle menu">

                    </div>
                </div>
                <div class="chat-row">
                    <div class="profile-avatar2">J</div>
                    <div class="chat-details">
                        <span class="chat-name">Business Owner 2</span>
                        <p class="chat-preview">Is this still available?</p>

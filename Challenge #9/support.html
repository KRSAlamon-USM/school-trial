<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support - Website</title>
    <link rel="icon" type="image/png" href="Icons/dashboard.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="parent">
 
    <header class="top">
        <div class="header-left">
            <span class="app-brand-name">Support</span>
        </div>
        <div class="header-right">
            <div class="profile-avatar" aria-label="Your profile">K</div>
        </div>
    </header>
 
    <nav class="navigation">
        <div class="nav-logo">
            <a href="#" id="menuToggle" aria-label="Toggle menu">
                <img src="Icons/hamburger.png" alt="" class="sidebar-logo">
            </a>
        </div>
        <ul id="navLinks">
            <li><a class="cbrowse" href="index.html">Browse</a></li>
            <li><a class="cprojects" href="interested.html">Interested</a></li>
            <li><a class="cmessages" href="messages.html">Messages</a></li>
            <li><a class="ctutorial" href="tutorial.html">Tutorial</a></li>
            <li><a class="csupport" href="support.html" aria-current="page">Support</a></li>
        </ul>
    </nav>
 
    <main class="div3">
        <h2 class="welcome-text">Support</h2>
        <div class="dashboard-grid">
 
            <section class="contact-card">
                <h3 class="section-title">Contact us</h3>
                <form class="contact-form" action="#" method="post">
 
                    <label for="name">Name</label><br>
                    <input type="text" id="name" name="name" placeholder="Your name" required><br><br>
 
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required><br><br>
 
                    <label for="subject">Subject</label><br>
                    <input type="text" id="subject" name="subject" placeholder="What is this about?"><br><br>
 
                    <label for="message">Message</label><br>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea><br><br>
 
                    <button type="submit" class="contact-btn">Send message</button>
                </form>
            </section>
 
        </div>
    </main>
 
</div>
<script src="script.js"></script>
</body>
</html>
